[project]
name = "autotubenail"
version = "0.1.0"
description = "YouTube livestream thumbnail generator (Pillow CLI)"
requires-python = ">=3.10"
dependencies = [
    "cairosvg>=2.9.0",
    "Pillow",
]

[project.scripts]
thumbnail = "generator:main"

[tool.setuptools]
py-modules = ["generator", "nodes", "assets"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
