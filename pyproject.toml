[project]
name = "autotubenail"
version = "0.1.0"
description = "YouTube livestream thumbnail generator (Pillow CLI)"
requires-python = ">=3.10"
dependencies = ["Pillow"]

[project.scripts]
thumbnail = "generator:main"

[tool.setuptools]
py-modules = ["generator"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
